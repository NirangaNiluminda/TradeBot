# ─────────────────────────────────────────────────────────────
#  tradebot configuration  (secrets go in .env, NOT here)
# ─────────────────────────────────────────────────────────────

exchange:
  name: binance
  mode: backtest          # backtest | testnet | live   (testnet/live come in Phase 3)
  quote_asset: USDT

market:
  symbols: [BTC/USDT, ETH/USDT]
  timeframe: 4h           # 15m | 1h | 4h | 1d   (4h: less noise and fees than 1h)

# Which strategy to use. See all with:  uv run tradebot strategies
# Chosen with `uv run tradebot optimize` (walk-forward test on unseen data, 2026-10-02):
# breakout was the only strategy profitable in all three honest tests
# (BTC/ETH 3y, BTC/ETH 5y, unseen coins SOL/BNB/XRP), profit factor ~1.2-1.3.
# Re-run `tradebot optimize` every few months to check it still holds.
strategy:
  name: breakout
  params:
    entry_period: 40        # buy on a break above the highest high of 40 candles (~7 days)
    exit_period: 20         # sell on a break below the lowest low of 20 candles
    volume_mult: 1.5        # ...only if volume is 1.5x the recent average
  # Composite example:
  # name: regime_switch
  # params:
  #   threshold: 25
  #   trend: {name: ema_cross, params: {fast: 12, slow: 26}}
  #   range: {name: rsi_reversion}

risk:
  budget_usdt: 10           # the bot never invests more than this in total
  position_size_pct: 95     # % of the remaining budget per trade (rest covers fees)
  exit_mode: atr            # atr = stops adapt to volatility | percent = fixed %
  # ATR = the typical price move per candle. 2.5 x ATR is usually 3-7% on 4h candles.
  stop_atr_mult: 2.5        # sell if price falls 2.5 x ATR below entry
  take_profit_atr_mult: 6.25  # sell if price rises 6.25 x ATR above entry (2.5 : 1 reward/risk)
  min_stop_pct: 1           # the stop is never closer than 1% ...
  max_stop_pct: 10          # ... or further than 10%
  stop_loss_pct: 5          # used in percent mode, and while ATR is warming up
  take_profit_pct: 10
  daily_loss_limit_pct: 5   # stop buying for the day after losing 5%
  max_open_positions: 1
  caution_size_mult: 0.5    # CAUTION news -> half size
  caution_stop_mult: 0.75   # CAUTION news -> stop-loss 25% closer

backtest:
  days: 365                 # test on the last N days
  # start: 2024-01-01       # or a fixed period (overrides days)
  # end: 2025-01-01
  starting_balance: 10
  fee_pct: 0.1              # Binance spot fee per order
  slippage_pct: 0.05        # extra price disadvantage on market orders

data:
  dir: data
